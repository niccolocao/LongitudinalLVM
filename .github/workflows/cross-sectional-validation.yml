name: Cross-sectional CFA validation
on:
  push:
    branches: [cross-sectional-cfa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install integration dependencies
        run: Rscript -e 'install.packages(c("fastGHQuad", "spacefillr"))'
      - name: Install package
        run: R CMD INSTALL .
      - name: Run cross-sectional numerical tests
        run: Rscript tests/cfa-cross-sectional.R
